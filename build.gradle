// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        activityVersion = '1.13.0'
        appCompatVersion = '1.7.1'
        coilVersion = '3.2.0'
        // composeCompilerVersion is no longer needed: with org.jetbrains.kotlin.plugin.compose
        // (Kotlin 2.x+), the Compose compiler is bundled with the Kotlin toolchain and
        // composeOptions.kotlinCompilerExtensionVersion is ignored.
        composeVersion = '1.10.6'
        coreKtxVersion = '1.18.0'
        coroutinesVersion = '1.10.2'
        // 2.x supports desugaring of Java 17–21 APIs (LocalDate, streams, etc.) and
        // is compatible with JDK 25. 1.x only covered Java 11 APIs.
        desugarLibVersion = '2.1.5'
        espressoVersion = '3.7.0'
        extJunitVersion = '1.3.0'
        googleMaterialversion = '1.13.0'
        kotlinVersion = "2.3.20"
        kotlinxSerializationVersion = "1.9.0"
        kspVersion = "2.3.6"
        lifecycleVersion = '2.10.0'
        material3Version = '1.4.0'
        navVersion = "2.9.7"
        junitVersion = "4.13.2"
        retroFit2Version = "3.0.0"
        retroFitKotlinSerializationVersion = "1.0.0"
        roboeletricVersion = "4.16.1"
        roomVersion = '2.8.4'
        truthVersion = "1.4.5"
        windowVersion = '1.5.1'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlinVersion"
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlinVersion"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion"
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:$kspVersion"
        classpath "com.google.android.gms:oss-licenses-plugin:0.11.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

tasks.matching { it.name == "debugOssLicensesCleanUp" }.configureEach { t ->
    t.dependsOn(tasks.named("debugOssDependencyTask"))
}
