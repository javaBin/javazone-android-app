apply plugin: "com.android.application"
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlinx-serialization'
apply plugin: 'com.google.android.gms.oss-licenses-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdkVersion 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId "no.javabin.javazone2026"
        minSdkVersion 36
        targetSdkVersion 36
        versionCode 7
        versionName "2026.1.0"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['en', 'no']
    }

    buildFeatures {
        compose = true
    }

    signingConfigs {
        release {
            if (project.hasProperty("JAVAZONE_KEYSTORE_PATH")) {
                storeFile new File(project.findProperty("JAVAZONE_KEYSTORE_PATH") as String)
                storePassword project.findProperty("JAVAZONE_KEYSTORE_PASSWORD")
                keyAlias project.findProperty("JAVAZONE_KEY_ALIAS")
                keyPassword project.findProperty("JAVAZONE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (project.hasProperty("JAVAZONE_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    java {
        toolchain {
            // Use JDK 25 to compile. The JDK version controls which JDK APIs and language
            // features are available in source, but does NOT set the class-file format.
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        // Keep bytecode at Java 21. Android uses ART (DEX), not the JVM, so targeting
        // bytecode > 21 buys nothing and breaks the Compose Preview renderer, which
        // runs on the IDE's embedded JDK and can only load class files up to major
        // version 65 (Java 21). Java 25 class files have major version 69.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // composeOptions.kotlinCompilerExtensionVersion is obsolete when the
    // org.jetbrains.kotlin.plugin.compose plugin is applied (Kotlin 2.x+).
    // The Compose compiler is now bundled with the Kotlin toolchain.

    // kotlinOptions{} was provided by the kotlin-android plugin; AGP 9 built-in
    // Kotlin support uses kotlin { compilerOptions { } } instead.
    kotlin {
        compilerOptions {
            // Must match targetCompatibility. Setting this to JVM_25 would emit class
            // files with major version 69, crashing the Compose Preview renderer on JDK 21.
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
            freeCompilerArgs.addAll(['-opt-in=kotlin.RequiresOptIn', '-jvm-default=no-compatibility'])
        }
    }

    packagingOptions {
        resources {
            pickFirsts += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
        jniLibs {
            keepDebugSymbols += ["*/libandroidx.graphics.path.so"]
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
    namespace 'no.javazone.scheduler'
}

// Pass Room's schema export directory to the KSP processor.
// The room {} DSL block requires the separate androidx.room Gradle plugin;
// a plain ksp {} argument achieves the same with no extra dependency.
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugarLibVersion"

    // kotlin
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationVersion"

    // android compose
    implementation "androidx.compose.runtime:runtime:$composeVersion"
    implementation "androidx.compose.ui:ui:$composeVersion"
    implementation "androidx.compose.foundation:foundation-layout:$composeVersion"
    implementation "androidx.compose.material3:material3:$material3Version"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    implementation "androidx.compose.foundation:foundation:$composeVersion"
    implementation "androidx.compose.ui:ui-tooling:$composeVersion"

    // google support libraries for android compose
    implementation "com.google.android.material:material:$googleMaterialversion"
    implementation 'com.google.android.gms:play-services-oss-licenses:17.5.1'

    implementation "androidx.appcompat:appcompat:$appCompatVersion"
    implementation "androidx.activity:activity-ktx:$activityVersion"
    implementation "androidx.core:core-ktx:$coreKtxVersion"
    implementation "androidx.activity:activity-compose:$activityVersion"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"

    implementation "androidx.navigation:navigation-compose:$navVersion"
    implementation "androidx.window:window:$windowVersion"

    // Image compose component
    implementation "io.coil-kt.coil3:coil-compose:$coilVersion"
    implementation "io.coil-kt.coil3:coil-network-okhttp:$coilVersion"
    implementation "io.coil-kt.coil3:coil-svg:$coilVersion"

    // database
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // http-client
    implementation "com.squareup.retrofit2:retrofit:$retroFit2Version"
    implementation "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:$retroFitKotlinSerializationVersion"

    // Splash screen API (replaces the custom SplashScreenActivity)
    implementation "androidx.core:core-splashscreen:1.2.0"

    // unittesting
    testImplementation "com.google.truth:truth:$truthVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "androidx.test.ext:junit:$extJunitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"
    testImplementation "org.robolectric:robolectric:$roboeletricVersion"

    // instrumented test
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "org.robolectric:robolectric:$roboeletricVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
    androidTestImplementation "com.google.truth:truth:$truthVersion"
    androidTestImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$extJunitVersion"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"

    // Testing Navigation
    androidTestImplementation "androidx.navigation:navigation-testing:$navVersion"
}
