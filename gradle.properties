org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=false
# Disable Gradle's Problems API HTML report. It is regenerated into the root
# build/ directory on every invocation (including `clean`), which re-creates a
# root-owned build/ dir inside the Docker container and blocks host-side builds.
systemProp.org.gradle.problems.report=false
